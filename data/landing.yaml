# Note: Template blocks require a 'weight' parameter so they're correctly ordered on the landing page

# Hero
hero:
  enable: true
  weight: 10
  template: hero

  backgroundImage:
    path: "images/"
    filename:
      desktop: "hero.webp"
      mobile: "hero.webp"

  badge:
    text: 2025-06-18
    color: primary # primary, secondary, success, danger, warning, info, light, dark
    pill: false # boolean
    soft: true # boolean

  # titleLogo:
  #   path: "images/logos"
  #   filename: "title_logo.png"
  #   alt: "Weitheme Logo"
  #   height: 80px

  title: "weiwmy's site"
  subtitle: share with you, better for us.
  image:
    path: "images" # path to image under configured assets directory. default 'images'
    filename: "hero.png" # filename of your hero image (including file extension)
    alt: "Weitheme Screenshot" # Optional but recommended
    boxShadow: true # default 'false' (excludes .svg images)
    rounded: true # round the image corners? default 'false' (excludes .svg images)

  ctaButton:
    icon: home
    btnText: "Home"
    url: "/docs/"
  cta2Button:
    icon: person
    btnText: "About"
    url: "https://github.com/weiwmy"

  info: "**Recently updated**"

# Feature Grid
featureGrid:
  enable: true
  weight: 20
  template: feature grid

  title: What is it?
  subtitle: weiwmy's site
  items:
    - title: A-Articles
      icon: article
      description: 文章
      
    - title: B-Photos
      icon: photo
      description: 图集

    - title: C-Audios
      icon: podcasts
      description: 音频

    - title: D-Videos
      icon: movie
      description: 视频

    - title: E-Share
      icon: share
      description: 分享

    - title: F-Study
      icon: school
      description: 学习

    - title: G-Work
      icon: work
      description: 工作

    - title: H-Life
      icon: weekend
      description: 生活

    - title: Y-Repo
      icon: apps
      description: 仓库

# Image compare
imageCompare:
  enable: true 
  weight: 30
  template: image compare

  title: who am I ?
  subtitle: I am a software engineer

  items:
    - title: Engineer
      config: {
        startingPoint: 50,
        addCircle: true,
        addCircleBlur: false,
        showLabels: true,
        labelOptions: {
          before: 'Dark',
          after: 'Light',
          onHover: false
        }
      }
      imagePath: "images/screenshots"
      #imageBefore: "weitheme_dark_v0.8.webp"
      #imageAfter: "weitheme_light_v0.8.webp"

    - title: Designer
      config: {
        controlColor: "#3C4257",
        startingPoint: 25,
        addCircle: true,
        addCircleBlur: false,
        showLabels: true,
        labelOptions: {
          before: 'Inter',
          after: 'Life Saver',
          onHover: false
        }
      }
      #imagePath: "images/screenshots"
      #imageBefore: "weitheme_google_font_demo_inter_screenshot.webp"
      #imageAfter: "weitheme_google_font_demo_lifesavers_screenshot.webp"

    - title: Writer
      config: {
        startingPoint: 25,
        addCircle: true,
        addCircleBlur: true,
        showLabels: true,
        labelOptions: {
          before: 'Blue',
          after: 'Cardinal',
          onHover: false
        }
      }
      #imagePath: "images/screenshots"
      #imageBefore: "weitheme_blue_theme_colour.webp"
     # imageAfter: "weitheme_cardinal_theme_colour.webp"
