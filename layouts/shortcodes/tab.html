<!-- https://github.com/rvanhorn/hugo-dynamic-tabs -->
{{ $tabName := .Get "tabName" }}
{{ $tabID := printf "tab-%d-%d" .Parent.Ordinal .Ordinal }}
{{ .Parent.Store.Add "tabName" (slice $tabName) }}
{{ .Parent.Store.Add "tabID" (slice $tabID) }}

<div class="tab-pane fade{{ if eq .Ordinal 0 }} show active{{ end }}" id="{{ $tabID }}" role="tabpanel" aria-labelledby="{{ $tabID }}Tab">

	{{ $.Inner }}

</div>
