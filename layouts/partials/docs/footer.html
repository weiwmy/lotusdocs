<!-- Footer Start -->
{{- $yearToken := site.Params.copyrightYearToken | default ":YEAR:" -}}
<footer class="shadow py-3 d-print-none">
    <div class="container-fluid">
        <div class="row align-items-center">
            <div class="col">
                <div class="text-sm-start text-center mx-md-2">
                    <p class="mb-0">
                        {{- replace site.Params.footer.copyright $yearToken (now.Format "2006") | markdownify -}}
                    </p>
                </div>
            </div><!--end col-->
        </div><!--end row-->
    </div><!--end container-->
</footer><!--end footer-->
<!-- End -->
