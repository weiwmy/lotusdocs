<script type="module">
    function initSearch() {
        const suggestions = document.getElementById('suggestions');
        const search = document.getElementById('flexsearch');
        const flexsearchContainer = document.getElementById('FlexSearchCollapse');
        const hideFlexsearchBtn = document.getElementById('hideFlexsearch');
        if (!suggestions || !search || !flexsearchContainer || !hideFlexsearchBtn) return;

        const flexsearchContainerCollapse = new Collapse(flexsearchContainer, { toggle: false });

        flexsearchContainer.addEventListener('shown.bs.collapse', () => search.focus());
        
        const topHeader = document.getElementById("top-header");
        document.addEventListener('click', (elem) => {
            if (!flexsearchContainer.contains(elem.target) && !topHeader.contains(elem.target))
                flexsearchContainerCollapse.hide();
        });

        hideFlexsearchBtn.onclick = () => flexsearchContainerCollapse.hide();

        function inputFocus(e) {
            if (e.ctrlKey && e.key === '/') {
                e.preventDefault();
                flexsearchContainerCollapse.toggle();
            }
            if (e.key === 'Escape') {
                search.blur();
                flexsearchContainerCollapse.hide();
            }
        }
        document.addEventListener('keydown', inputFocus);

        // FlexSearch Index Initialization (Global Cache)
        if (!window.flexSearchIndex) {
            window.flexSearchIndex = new FlexSearch.Document({
                tokenize: {{ site.Params.flexsearch.tokenize | default "forward" }},
                minlength: {{ site.Params.flexsearch.minQueryChar | default 0}},
                cache: {{ site.Params.flexsearch.cache | default 100 }},
                optimize: {{ site.Params.flexsearch.optimize | default true }},
                document: {
                    id: 'id',
                    store: ["href", "title", "description"],
                    index: ["title", "description", "content"]
                }
            });

            {{ $list := slice }}
            {{- if and (isset site.Params.flexsearch "searchsectionsindex") (not (eq (len site.Params.flexsearch.searchSectionsIndex) 0)) }}
                {{- if eq site.Params.flexsearch.searchSectionsIndex "ALL" }}
                    {{- $list = site.Pages }}
                {{- else }}
                    {{- $list = (where site.Pages "Type" "in" site.Params.flexsearch.searchSectionsIndex) }}
                    {{- if (in site.Params.flexsearch.searchSectionsIndex "HomePage") }}
                        {{ $list = $list | append site.Home }}
                    {{- end }}
                {{- end }}
            {{- else }}
                {{- $list = (where site.Pages "Section" (page.Store.Get "pathName")) }}
            {{- end }}

            {{ range $index, $element := $list -}}
                window.flexSearchIndex.add({
                    id: {{ $index }},
                    href: "{{ .RelPermalink }}",
                    title: {{ .Title }},
                    {{ with .Description -}}
                        description: {{ . }},
                    {{ else -}}
                        description: {{ .Summary | htmlUnescape | plainify }},
                    {{ end -}}
                    content: {{ .Content | htmlUnescape | plainify }}
                });
            {{ end -}}
        }

        search.oninput = function() {
            const maxResult = {{ site.Params.flexsearch.maxResult | default 5}};
            const minlength = {{ site.Params.flexsearch.minQueryChar | default 0}};
            const searchQuery = this.value; // Assume sanitized or use a sanitizer if needed
            const results = window.flexSearchIndex.search(searchQuery, {limit: maxResult, enrich: true});

            const flatResults = new Map();
            for (const result of results.flatMap(r => r.result)) {
                if (flatResults.has(result.doc.href)) continue;
                flatResults.set(result.doc.href, result.doc);
            }

            suggestions.innerHTML = "";
            suggestions.classList.remove('d-none');

            if (searchQuery.length < minlength) {
                const minCharMessage = document.createElement('div');
                minCharMessage.innerHTML = `Please type at least <strong>${minlength}</strong> characters`;
                minCharMessage.classList.add("suggestion__no-results");
                suggestions.appendChild(minCharMessage);
                return;
            }

            if (flatResults.size === 0 && searchQuery) {
                const noResultsMessage = document.createElement('div');
                noResultsMessage.innerHTML = {{ i18n "search_no_results" | default "No results for" }} + ` "<strong>${searchQuery}</strong>"`;
                noResultsMessage.classList.add("suggestion__no-results");
                suggestions.appendChild(noResultsMessage);
                return;
            }

            for(const [href, doc] of flatResults) {
                const entry = document.createElement('div');
                const a = document.createElement('a');
                a.href = href;
                entry.appendChild(a);

                const title = document.createElement('span');
                title.textContent = doc.title;
                title.classList.add("suggestion__title");
                a.appendChild(title);

                const description = document.createElement('span');
                description.textContent = doc.description;
                description.classList.add("suggestion__description");
                a.appendChild(description);

                suggestions.appendChild(entry);
                if(suggestions.childElementCount == maxResult) break;
            }
        };
    }

    if (window.Turbo) {
        document.addEventListener("turbo:load", initSearch);
    } else {
        document.addEventListener("DOMContentLoaded", initSearch);
    }
</script>
