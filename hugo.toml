baseURL = "https://weidocs.vercel.app/"
contentDir = "content"
enableEmoji = true
enableGitInfo = true 
defaultContentLanguage = 'en'
[languages]
  [languages.en]
    title = "weiwmy's site"
        label = "English"
        locale = "en-GB"
    weight = 10

[module]
  [module.hugoVersion]
    extended = true
    min = "0.159.0"
  [[module.imports]]
    path = "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"
    disable = false

[params]
    [params.footer]
        copyright = "©2021-:YEAR: [**WEI-WMY**](https://github.com/weiwmy/weitheme)"
        version = true   # includes git commit info

    [params.social]
        github = "weiwmy"         # YOUR_GITHUB_ID or YOUR_GITHUB_URL
        #twitter = "weiwmy"       # YOUR_TWITTER_ID
        #instagram = "weiwmy"     # YOUR_INSTAGRAM_ID
        #rss = true               # show rss icon with link

    [params.docs] # Parameters for the /docs 'template'
        title           = "weiwmy's site"           # default html title for documentation pages/sections

        pathName        = "docs"                            # path name for documentation site | default "docs"

        themeColor      = "blue"                            # (optional) - Set theme accent colour. Options include: blue (default), green, red, yellow, emerald, cardinal, magenta, cyan

        darkMode        = true                                # enable dark mode option? default false

        prism           = true                                # enable syntax highlighting via Prism

        prismTheme      = "solarized-light"                           # (optional) - Set theme for PrismJS. Options include: default, solarized-light, twilight, lucario

        # gitinfo
        repoURL         = "https://github.com/weiwmy/weitheme"  # Git repository URL for your site [support for GitHub, GitLab, and BitBucket]
        repoBranch      = "release"
        editPage        = true                                # enable 'Edit this page' feature - default false
        lastMod         = true                                # enable 'Last modified' date on pages - default false
        lastModRelative = true                                # format 'Last modified' time as relative - default true

        sidebarIcons    = true                                # enable sidebar icons? default false
        breadcrumbs     = true                                # default is true
        backToTop       = true                                # enable back-to-top button? default true

        # ToC
        toc             = true                                # enable table of contents? default is true
        tocMobile       = true                                # enable table of contents in mobile view? default is true
        scrollSpy       = true                                # enable scrollspy on ToC? default is true

        # front matter
        descriptions    = true                                # enable front matter descriptions under content title?
        titleIcon       = false                                # enable front matter icon title prefix? default is false

        # content navigation
        navDesc         = true                                # include front matter descriptions in Prev/Next navigation cards
        navDescTrunc    = 30                                  # Number of characters by which to truncate the Prev/Next descriptions

        listDescTrunc   = 100                                 # Number of characters by which to truncate the list card description

        # Link behaviour
        intLinkTooltip  = true                                # Enable a tooltip for internal links that displays info about the destination? default false
        extLinkNewTab   = true                                # Open external links in a new Tab? default true
        logoLinkURL = "https://weidocs.vercel.app/"               # Set a custom URL destination for the top header logo link.

    [params.flexsearch] # Parameters for FlexSearch
        enabled             = true
        tokenize            = "full"
        optimize            = true
        cache               = 100
        minQueryChar        = 3 # default is 0 (disabled)
        maxResult           = 5 # default is 5
        searchSectionsIndex = []

[menu]
[[menu.primary]]
    name  = "Docs"
    url = "/docs/"
    identifier = "docs"
    weight = 10
[[menu.primary]]
    name  = "Blog"
    url = "/blog/"
    identifier = "blog"
    weight = 20
[[menu.primary]]
    name  = "About"
    url = "/docs/a-articles/a1-introduce/01-about/"
    identifier = "about"
    weight = 30
